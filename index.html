<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caminhada de Fé — 52 Semanas de Oração e Reflexão com Deus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#FAF7F2',
            surface: '#F3EDE3',
            midnight: '#1B2B4A',
            gold: '#B8975A',
            'gold-light': '#D4B483',
            body: '#2C2C2C',
            muted: '#6B6458',
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Lato', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Lato', system-ui, sans-serif; }
    .font-serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none !important; opacity: 1 !important; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { opacity: 0; }
    .fade-in.visible { animation: fadeInUp 0.4s ease forwards; }
    .gold-divider {
      width: 60px; height: 1px;
      background: rgba(184,151,90,0.5);
      margin: 0 auto;
    }
  </style>
</head>
<body class="bg-bg text-body antialiased">

  <!-- S1: Hero -->
<section class="bg-midnight min-h-screen flex items-center py-20 px-6">
  <div class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

    <!-- Copy -->
    <div class="fade-in text-center lg:text-left">
      <p class="text-gold font-sans text-sm tracking-widest uppercase mb-6">Evangelho e Palavra</p>
      <h1 class="font-serif text-5xl lg:text-6xl xl:text-7xl font-semibold leading-tight mb-6"
          style="color:#EDE8DC;">
        Um ano inteiro<br />
        caminhando<br />
        <span style="color:#B8975A;">com Deus.</span>
      </h1>
      <p class="text-lg font-sans font-light leading-relaxed mb-8 max-w-md mx-auto lg:mx-0"
         style="color:#C8BFB0;">
        52 semanas de oração e reflexão para quem precisa de presença, não de resposta.
      </p>
      <a href="HOTMART_LINK"
         class="inline-block bg-gold hover:bg-gold-light text-white font-sans font-semibold text-base px-10 py-4 rounded-lg transition-colors duration-200 cursor-pointer mb-8">
        Quero começar minha caminhada
      </a>
      <p class="font-sans text-sm" style="color:#8A9BBF;">
        86 mil inscritos confiam no canal Evangelho e Palavra
      </p>
    </div>

    <!-- Mockup -->
    <div class="fade-in flex justify-center lg:justify-end" style="animation-delay:0.15s;">
      <div class="relative">
        <img src="assets/capa-caminhada-de-fe.webp"
             alt="Capa do ebook Caminhada de Fé"
             width="320" height="511"
             fetchpriority="high"
             class="rounded-xl"
             style="box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(184,151,90,0.2); transform: rotate(2deg);" />
      </div>
    </div>

  </div>
</section>

  <script>
    // Intersection Observer for fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
